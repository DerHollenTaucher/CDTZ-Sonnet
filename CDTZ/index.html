<!DOCTYPE html>
<html>
<head>
    <title>WallCity</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <style>
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="instructions">
        Click to start. Use WASD to move, mouse to look around, space to jump.
    </div>
    <script type="module" src="game.js"></script>
    <!-- Three.js render container -->
     <div id="canvas-container"></div>
     <!-- Game Over Screen-->
      <div id="gameOverUI" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100;text-align:center; padding-top: 150px;">


        <img id="gameOverImg" src="" style="width: 200px; height: 200px; border-radius: 10px;">
        <h1 id="gameOverText" style="color: #ff4444; font-size: 36px; margin: 20px 0; font-family: 'Arial Black';"></h1>
        <button onclick="restartGame()" style="padding: 12px 36px; font-size: 22px; background: #ff3333; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Try Again!</button>
       </div>

       <div id="quizUI" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 110; text-align: center; padding-top: 150px;">
        <h2 id="quizQuestion" style="color: white; font-size: 32px; margin-bottom: 30px;"></h2>
        <input type="text" id="quizInput" style="padding: 10px 20px; font-size: 24px; width: 300px; border-radius: 8px; border: none;">
        <button onclick="checkAnswer()" style="margin-left: 10px; padding: 10px 20px; font-size: 24px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer;">Submit</button>
        <p id="quizTip" style="color: #ff4444; font-size: 20px; margin-top: 20px;"></p>
     </div>

</body>
</html>
